name: Roadbook nightly site refresh
on:
  schedule:
    - cron: '0 3 * * *'
      timezone: Europe/Helsinki
  workflow_dispatch:
permissions:
  contents: read
jobs:
  netlify-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private Netlify build when configured
        env:
          BUILD_HOOK: ${{ secrets.NETLIFY_ROADBOOK_BUILD_HOOK }}
        run: |
          if [ -z "$BUILD_HOOK" ]; then
            echo "Nightly publisher not enabled; no deployment requested."
            exit 0
          fi
          case "$BUILD_HOOK" in
            https://api.netlify.com/build_hooks/*) ;;
            *) echo "Invalid Netlify hook"; exit 1 ;;
          esac
          curl -fsS --max-time 30 -X POST -d '{}' "$BUILD_HOOK" >/dev/null
          echo "Private Netlify rebuild requested."
